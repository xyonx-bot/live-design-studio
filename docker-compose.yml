version: '3.8'

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: livepreview_api
    volumes:
      - workspace-data:/workspace
    environment:
      - WORKSPACE_PATH=/workspace
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DEBUG=true
      - HERMES_AGENT_URL=${HERMES_AGENT_URL:-http://172.19.0.1:9119}
    networks:
      - joyverse_main_network
    restart: unless-stopped
    env_file:
      - .env

  workspace:
    build:
      context: ./workspace
      dockerfile: Dockerfile
    container_name: livepreview_workspace
    volumes:
      - workspace-data:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=https://live-preview.joyverse.fun/api
    networks:
      - joyverse_main_network
    restart: unless-stopped
    env_file:
      - .env

  screenshotter:
    build:
      context: ./screenshotter
      dockerfile: Dockerfile
    container_name: livepreview_screenshotter
    volumes:
      - workspace-data:/workspace:ro
    networks:
      - joyverse_main_network
    restart: unless-stopped
    env_file:
      - .env

volumes:
  workspace-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/ubuntu/live-preview/workspace

networks:
  joyverse_main_network:
    external: true