
services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: livepreview_api
    # Run as the host user so the workspace volume stays writable by the agent.
    user: "1000:1000"
    volumes:
      - /home/ubuntu/live-preview/workspace:/workspace
    environment:
      - WORKSPACE_PATH=/workspace
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DEBUG=true
      - HERMES_AGENT_URL=${HERMES_AGENT_URL:-http://172.19.0.1:9119}
    networks:
      - joyverse_main_network
    restart: unless-stopped
    env_file:
      - .env

  workspace:
    build:
      context: ./workspace
      dockerfile: Dockerfile
    container_name: livepreview_workspace
    volumes:
      - /home/ubuntu/live-preview/workspace:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=https://live-preview.joyverse.fun/api
    networks:
      - joyverse_main_network
    restart: unless-stopped
    env_file:
      - .env

  screenshotter:
    build:
      context: ./screenshotter
      dockerfile: Dockerfile
    container_name: livepreview_screenshotter
    volumes:
      - /home/ubuntu/live-preview/workspace:/workspace:ro
    networks:
      - joyverse_main_network
    restart: unless-stopped
    env_file:
      - .env

volumes:
  # no named volumes; all paths are bind-mounted from the host
  {}

networks:
  joyverse_main_network:
    external: true